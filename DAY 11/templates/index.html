<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Classifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
    }
    .main-card {
      background: rgba(255,255,255,0.03);
      border-radius: 1rem;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 2rem 2.5rem;
    }
    .custom-btn {
      min-width: 180px;
    }
    .card-img-top {
      object-fit: cover;
      max-height: 300px;
    }
  </style>
</head>
<body class="bg-dark text-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="main-card mt-5">
          <h1 class="mb-4 text-center fw-bold">🖼️ Image Classifier</h1>

          <!-- Flash messages -->
          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{ messages[0] }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endif %}
          {% endwith %}

          <!-- Upload Form -->
          <form method="POST" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
              <label for="file" class="form-label">Select an image to classify</label>
              <input type="file" name="file" id="file" class="form-control" accept="image/*" required>
            </div>
            <div class="d-grid">
              <button class="btn btn-primary custom-btn" type="submit">
                <i class="bi bi-upload"></i> Upload & Classify
              </button>
            </div>
          </form>

          <!-- Result Display -->
          {% if label %}
            <div class="card text-dark mx-auto mb-3 shadow" style="max-width: 400px;">
              <img src="{{ url_for('uploaded_file', filename=filename) }}" class="card-img-top" alt="Uploaded Image">
              <div class="card-body">
                <h5 class="card-title text-center">Prediction: <strong>{{ label }}</strong></h5>
                <p class="card-text text-center">Confidence: <span class="fw-bold">{{ confidence }}</span></p>
              </div>
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Optionally add Bootstrap Icons CDN for upload icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
